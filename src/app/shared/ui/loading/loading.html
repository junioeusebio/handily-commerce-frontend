<div
  [attr.role]="decorative() ? null : 'status'"
  [attr.aria-live]="decorative() ? null : 'polite'"
  [attr.aria-hidden]="decorative() ? 'true' : null"
  [class]="inline() ? 'inline-flex ' + className() : className()"
>
  @if (!decorative()) {
    <span class="sr-only">{{ message() }}</span>
  }
  @switch (variant()) {
    @case ('skeleton-cards') {
      <ul
        class="loading-skeleton-cards m-0 grid list-none gap-4 p-0 sm:grid-cols-2"
        aria-hidden="true"
      >
        @for (i of items(); track i) {
          <li
            class="flex min-h-[11.5rem] flex-col rounded-2xl border border-[#d7e0ec] bg-white p-[1.2rem] shadow-[0_10px_28px_rgba(7,17,31,0.06)] motion-safe:animate-pulse"
          >
            <span class="block h-4 w-20 rounded-full bg-[#e8f1fb]"></span>
            <span class="mt-[0.9rem] block h-5 w-3/4 rounded bg-[#e3e9f1]"></span>
            <span class="mt-3 block h-3 w-full rounded bg-[#eef2f7]"></span>
            <span class="mt-2 block h-3 w-5/6 rounded bg-[#eef2f7]"></span>
            <span class="mt-4 block h-3 w-1/2 rounded bg-[#eef2f7]"></span>
            <span class="mt-auto block h-9 w-40 rounded-full bg-[#e3e9f1] pt-4"></span>
          </li>
        }
      </ul>
    }
    @case ('skeleton-list') {
      <ul class="loading-skeleton-list m-0 grid list-none gap-3 p-0" aria-hidden="true">
        @for (i of items(); track i) {
          <li
            class="flex items-center gap-3 rounded-xl border border-[#d7e0ec] bg-white p-3 motion-safe:animate-pulse"
          >
            <span class="block size-10 shrink-0 rounded-full bg-[#e8f1fb]"></span>
            <span class="flex flex-1 flex-col gap-2">
              <span class="block h-3 w-2/3 rounded bg-[#e3e9f1]"></span>
              <span class="block h-3 w-1/3 rounded bg-[#eef2f7]"></span>
            </span>
          </li>
        }
      </ul>
    }
    @default {
      @if (inline()) {
        <span class="loading-spinner inline-flex items-center" aria-hidden="true">
          <span [class]="spinnerClasses()"></span>
        </span>
      } @else {
        <div
          class="loading-spinner flex items-center justify-center gap-3 py-6 text-sm text-[#5b6b7c]"
        >
          <span [class]="spinnerClasses()" aria-hidden="true"></span>
          <span aria-hidden="true">{{ message() }}</span>
        </div>
      }
    }
  }
</div>
