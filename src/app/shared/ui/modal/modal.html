@if (open()) {
  <dialog
    #dialogEl
    [id]="dialogId()"
    [attr.aria-labelledby]="labelledBy() ?? titleId()"
    aria-modal="true"
    tabindex="-1"
    [class]="
      'fixed left-1/2 top-1/2 z-50 m-0 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 -translate-y-1/2 overflow-auto rounded-2xl border-0 bg-white p-0 shadow-[0_24px_60px_rgba(7,17,31,0.35)] backdrop:bg-[#07111f]/55 ' +
      panelClass()
    "
    (click)="onDialogClick($event)"
    (keydown)="onDialogKeydown($event)"
    (cancel)="onDialogCancel($event)"
  >
    <ng-content />
  </dialog>
}
