<div
  class="pointer-events-none fixed top-4 right-4 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-2"
  role="status"
  aria-live="polite"
>
  @for (t of toast.toasts(); track t.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-[0.75rem] border px-4 py-3 text-sm shadow-lg motion-safe:transition motion-safe:duration-200 starting:-translate-y-2 starting:opacity-0 {{
        tone[t.type]
      }}"
      [attr.data-toast-type]="t.type"
    >
      <p class="m-0 flex-1 font-semibold">{{ t.message }}</p>
      <button
        type="button"
        class="-m-1 rounded p-1 leading-none text-white/90 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
        aria-label="Fechar notificação"
        (click)="toast.dismiss(t.id)"
      >
        <span aria-hidden="true" class="text-lg">×</span>
      </button>
    </div>
  }
</div>
