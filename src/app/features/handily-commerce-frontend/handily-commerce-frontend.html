<div class="handily-home min-h-dvh bg-white text-[#0b1f3a]">
  <a
    class="skip-link sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-full focus:bg-white focus:px-[1.15rem] focus:py-[0.6rem] focus:text-sm focus:font-bold focus:text-[#0b1f3a] focus:no-underline focus:shadow-lg"
    href="#conteudo"
    >Pular para o conteúdo</a
  >

  <app-home-nav [leadOpen]="leadOpen()" (requestLead)="openLead($event)" />

  <main id="conteudo" tabindex="-1" class="scroll-mt-[4.5rem] outline-none">
    <app-home-hero (requestLead)="openLead($event)" />
    <app-home-about />
    <app-home-services (requestLead)="openLead($event)" />
    <app-home-solutions (requestLead)="openLead($event)" />
    @defer (on viewport) {
      <app-home-courses (requestCourseLead)="openCourseLead($event)" />
    } @placeholder {
      <section id="cursos" class="bg-[#f3f6fa] py-12" aria-hidden="true">
        <div class="mx-auto max-w-6xl px-5 sm:px-6">
          <app-loading variant="skeleton-cards" [count]="4" [decorative]="true" />
        </div>
      </section>
    }
    <app-home-banner (requestLead)="openLead($event)" />
    @defer (on viewport) {
      <app-home-testimonials />
    } @placeholder {
      <section id="depoimentos" class="py-12" aria-hidden="true">
        <div class="mx-auto max-w-6xl px-5 sm:px-6">
          <app-loading variant="skeleton-list" [count]="3" [decorative]="true" />
        </div>
      </section>
    }
    @defer (on viewport) {
      <app-home-faq />
    } @placeholder {
      <section id="faq" class="bg-[#f3f6fa] py-12" aria-hidden="true">
        <div class="mx-auto max-w-6xl px-5 sm:px-6">
          <app-loading variant="skeleton-list" [count]="4" [decorative]="true" />
        </div>
      </section>
    }
    <app-home-contact [contactEmail]="contactEmail" (requestLead)="openLead($event)" />
  </main>

  <app-home-footer
    [feVersion]="feVersion"
    [apiVersionLabel]="apiVersionLabel()"
    [apiStatusLabel]="apiStatusLabel()"
    [contactEmail]="contactEmail"
    (requestLead)="openLead($event)"
  />
</div>

<app-lead-dialog
  [open]="leadOpen()"
  (openChange)="leadOpen.set($event)"
  [contactEmail]="contactEmail"
/>
