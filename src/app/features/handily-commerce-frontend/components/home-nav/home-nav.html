<header
  class="sticky top-0 z-40 border-b border-white/10 bg-[#07111f]/[0.92] text-white backdrop-blur-[10px]"
>
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-[0.7rem] sm:px-6">
    <a class="flex items-center gap-[0.7rem] text-inherit no-underline" href="#">
      <img
        ngSrc="assets/img/logo.webp"
        width="40"
        height="40"
        alt="Handily"
        priority
        class="h-10 w-10 rounded-full object-cover shadow-[0_0_0_2px_rgba(255,255,255,0.15)]"
      />
      <span class="leading-tight">
        <strong class="block text-base tracking-[0.01em]">Handily</strong>
        <small class="block text-[0.65rem] uppercase tracking-[0.06em] text-white/55"
          >Software · municípios</small
        >
      </span>
    </a>
    <nav class="hidden gap-[1.4rem] text-sm text-white/78 md:flex" aria-label="Principal">
      <a class="hover:text-white" href="#solucoes">Soluções</a>
      <a class="hover:text-white" href="#bncc">BNCC</a>
      <a class="hover:text-white" href="#depoimentos">Clientes</a>
      <a class="hover:text-white" href="#faq">FAQ</a>
    </nav>
    <app-button
      variant="primary"
      ariaHaspopup="dialog"
      [ariaExpanded]="leadOpen()"
      ariaControls="lead-dialog"
      (pressed)="requestLead.emit($event)"
    >
      Solicitar orçamento
    </app-button>
  </div>
</header>
