<footer class="site bg-[#07111f] text-white" id="contato">
  <div
    class="mx-auto grid max-w-6xl gap-7 px-5 py-9 sm:grid-cols-2 sm:px-6 lg:grid-cols-[1.2fr_1fr_1fr]"
  >
    <div>
      <p class="m-0 text-[1.1rem] font-bold">Handily</p>
      <p class="mt-[0.45rem] mb-0 text-sm text-white/70">
        Software · Administração · BNCC para municípios
      </p>
    </div>
    <div>
      <p class="m-0 text-[0.65rem] uppercase tracking-[0.1em] text-white/45">Contato</p>
      <p class="mt-[0.45rem] mb-0 text-sm">
        <a class="text-white/90 no-underline" [href]="'mailto:' + contactEmail()">{{
          contactEmail()
        }}</a>
      </p>
    </div>
    <div>
      <p class="m-0 text-[0.65rem] uppercase tracking-[0.1em] text-white/45">Orçamento</p>
      <app-button
        variant="primary"
        className="mt-[0.7rem]"
        (pressed)="requestLead.emit($event)"
      >
        Solicitar orçamento
      </app-button>
    </div>
  </div>
  <div
    class="app-versions border-t border-white/10 px-5 py-4 text-[0.72rem] text-white/45 tabular-nums sm:px-6"
  >
    <div class="mx-auto max-w-6xl">
      © COPYRIGHT 2026 AJKSys Consulting · WEB: {{ feVersion() }} | API:
      {{ apiVersionLabel() }} · {{ apiStatusLabel() }}
    </div>
  </div>
</footer>
