<section id="contato" class="bg-white py-12">
  <div class="mx-auto max-w-6xl px-5 sm:px-6">
    <p class="m-0 text-[0.65rem] font-bold uppercase tracking-[0.1em] text-[#1e5bb8]">
      Contato
    </p>
    <h2 class="mt-2 m-0 text-[clamp(1.4rem,2.5vw,1.85rem)] tracking-tight">Fale conosco</h2>
    <p class="mt-[0.7rem] max-w-3xl text-[0.95rem] leading-relaxed text-[#5b6b7c]">
      Dúvidas sobre formação BNCC Computação, sistemas ou administração para a sua rede municipal?
      Escreva para a AJKSys ou solicite um orçamento — respondemos pelo e-mail institucional.
    </p>

    <div
      class="mt-8 flex flex-col gap-5 rounded-[1rem] border border-[#d7e0ec] bg-[#f3f6fa] px-[1.15rem] py-[1.1rem] sm:flex-row sm:items-center sm:justify-between"
    >
      <div>
        <p class="m-0 text-[0.65rem] font-bold uppercase tracking-[0.1em] text-[#5b6b7c]">
          E-mail
        </p>
        <a
          class="mt-[0.35rem] inline-block text-[1.05rem] font-semibold text-[#0b1f3a] no-underline hover:text-[#1e5bb8]"
          [href]="'mailto:' + contactEmail()"
          >{{ contactEmail() }}</a
        >
      </div>
      <app-button
        variant="primary"
        className="w-fit shrink-0"
        ariaHaspopup="dialog"
        ariaControls="lead-dialog"
        (pressed)="requestLead.emit($event)"
      >
        Solicitar orçamento
      </app-button>
    </div>
  </div>
</section>
