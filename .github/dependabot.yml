# Dependabot — atualizações semanais (segunda), agrupadas: 1 PR por ecossistema.
# Os PRs já nascem com o label "Release Patch" para passar no require-release-label.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - "Release Patch"
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "zone.js"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Angular 22 exige TypeScript >=6.0 <6.1; ignorar majors até o Angular suportar.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    labels:
      - "Release Patch"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
