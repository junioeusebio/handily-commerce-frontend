name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run test:ci

      - name: Build for GitHub Pages
        run: npx ng build --configuration production --base-href=/handily-commerce-frontend/

      # Deep links (ex.: /admin) no GitHub Pages: o Pages serve 404.html para rotas
      # desconhecidas; sendo cópia do index.html, o router do Angular assume.
      - name: SPA fallback (404.html)
        run: cp dist/handily-commerce-frontend/browser/index.html dist/handily-commerce-frontend/browser/404.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/handily-commerce-frontend/browser

  sonar:
    name: sonar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      # PRs do Dependabot não recebem os secrets do Actions. Sem SONAR_TOKEN o
      # scan é pulado (o job fica verde). Para analisar também esses PRs, cadastre
      # SONAR_TOKEN em Settings → Secrets and variables → Dependabot.
      - name: Check SONAR_TOKEN
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN indisponível (ex.: PR do Dependabot). SonarQube Scan pulado."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        if: steps.sonar-token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, sonar]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5